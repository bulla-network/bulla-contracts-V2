name: Release

on:
  push:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: "Test Before Release 🧪"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Install forge dependencies
        run: forge install

      - name: Run forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run tests
        run: forge test --gas-report

      - name: Generate coverage report
        run: |
          forge coverage --report lcov
          # Filter out mocks and test files from coverage
          node -e "
            const fs = require('fs'); 
            const data = fs.readFileSync('lcov.info','utf8'); 
            fs.writeFileSync('lcov.info', 
              data.split('\n')
                  .filter(line => !line.includes('SF:src/mocks/'))
                  .filter(line => !line.includes('SF:test/'))
                  .join('\n')
            );
          "

  release:
    name: "Semantic Release 🚀"
    needs: test
    runs-on: ubuntu-latest
    if: github.repository == 'bulla-network/bulla-contracts-V2' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          cache: "yarn"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Install forge dependencies
        run: forge install

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Build contracts
        run: forge build

      - name: Generate TypeChain types
        run: yarn typechain

      - name: Verify package can be packed
        run: yarn pack --dry-run

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: npx semantic-release

      # Tells bulla-registry to consolidate now. The token comes from the bulla-registry-notify app, which
      # can only start workflows in bulla-registry (Actions: write), so its key can't change any code.
      - name: Mint a bulla-registry-notify token
        id: registry-notify
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REGISTRY_NOTIFY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_NOTIFY_APP_PRIVATE_KEY }}
          owner: bulla-network
          repositories: bulla-registry
          permission-actions: write

      - name: Notify bulla-registry
        env:
          GH_TOKEN: ${{ steps.registry-notify.outputs.token }}
        run: gh workflow run consolidate.yml -R bulla-network/bulla-registry -f source=${{ github.repository }}
